services:
  postgres:
    image: postgres:18
    container_name: database
    environment:
      POSTGRES_DB: Biernotificatie
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Biernotificatie2026
    ports:
      - "5434:5432"

  app:
    build: .
    container_name: backend
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/Biernotificatie
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: Biernotificatie2026